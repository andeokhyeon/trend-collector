<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}키워드 헌터{% endblock %}</title>
<meta name="description" content="{% block desc %}검색량만 보면 경쟁을 알 수 없습니다. 키워드 검색·추적·발굴·단가·발행량·AI 진단까지 한 번에.{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ⚠️ 800·900 굵기를 일부러 뺐다 (2026-08-28).
     한글 폰트는 굵기 하나가 수백 조각이라 6종이면 모바일이 무겁고,
     화면도 너무 두꺼워 가독성이 떨어진다는 피드백.
     빠진 굵기는 브라우저가 700으로 대신 그린다. -->
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/bridge.css">
<link rel="stylesheet" href="/static/parity.css">
</head>
<!-- ⚠️ 클래스 이름(stApp, block-container …)을 스트림릿 것 그대로 쓴다.
     ui.py에서 뽑아낸 CSS를 한 줄도 고치지 않고 쓰기 위해서다.
     눈으로 베껴 옮기면 반드시 어딘가 달라진다. 이름은 나중에 한 번에 바꾼다. -->
<body class="stApp">
<div class="block-container">

  <div class="masthead">
    <a class="mast-brand" href="/">
      {% if logo %}<img class="mast-logo" src="{{ logo }}" alt="">{% endif %}
      <span class="mast-name">키워드<b>헌터</b></span>
    </a>
    <div class="mast-meta">
      <a class="mast-guide" href="/guide" title="이용 가이드">이용법</a><span class="mast-sep">·</span>
      {%- if me_label %}<a class="mast-me" href="/me" title="마이페이지">{{ me_label }}</a>{% if meta %}<span class="mast-sep">·</span>{% endif %}{% endif -%}
      {{ meta }}</div>
  </div>

  <nav role="tablist">
    {% for name, href in tabs %}
    <a role="tab" href="{{ href }}"
       aria-selected="{{ 'true' if href == active_tab else 'false' }}">{{ name }}</a>
    {% endfor %}
  </nav>

  <div role="tabpanel">
    {% block body %}{% endblock %}
  </div>

</div>

<!-- 로딩 표시 — 조회·로그인이 2초 넘게 걸리면 도넛을 띄운다 -->
<div id="kh-busy" hidden><div class="kh-donut"></div><p id="kh-busy-msg">잠시만요…</p></div>
<script>
(function () {
  var t = null;
  function arm(msg) {
    if (t) return;
    t = setTimeout(function () {
      document.getElementById("kh-busy-msg").textContent = msg;
      document.getElementById("kh-busy").hidden = false;
    }, 2000);
  }
  // 검색(조회) 폼 제출
  document.addEventListener("submit", function (e) {
    var f = e.target;
    if (f.classList && f.classList.contains("search-box")) arm("조회 중입니다…");
  });
  // 오래 걸릴 수 있는 링크들
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a");
    if (!a) return;
    var href = a.getAttribute("href") || "";
    if (a.classList.contains("social-btn") || href.indexOf("/login/") === 0) {
      arm("로그인 중입니다…");
    } else if (href.indexOf("rank=1") !== -1) {
      arm("연관 키워드의 문서수를 재는 중입니다…");   // 기회 있는 키워드 보기
    } else if (a.classList.contains("tc-btn")) {
      arm("기록을 불러오는 중입니다…");               // 추적기 자세히
    }
  });
  // 뒤로가기로 돌아왔을 때 남아있지 않게
  window.addEventListener("pageshow", function () {
    if (t) { clearTimeout(t); t = null; }
    document.getElementById("kh-busy").hidden = true;
  });
})();
</script>
</body>
</html>
